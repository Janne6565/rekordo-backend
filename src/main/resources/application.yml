spring:
  application:
    name: rekordo-backend
  servlet:
    multipart:
      # Slightly above the app's own limit, so an oversized upload is rejected by the
      # service with a clear message rather than by the container with a generic one.
      max-file-size: 16MB
      max-request-size: 16MB
  datasource:
    url: ${MC_DB_URL:jdbc:postgresql://localhost:5432/musiccollector}
    username: ${MC_DB_USER:musiccollector}
    password: ${MC_DB_PASSWORD:musiccollector}
  jpa:
    hibernate:
      # Schema is owned by Flyway. Never raise this above `validate` in any environment.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      # RFC 7807 for framework-raised errors too, not just BaseException.
      enabled: true

rekordo:
  jwt:
    # No fallback on purpose: the app must fail to start rather than run on a known secret.
    secret: ${MC_JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    # Used when "keep me signed in" is off — one sitting, not a month.
    session-refresh-token-ttl: PT12H
  auth:
    # Off only for local HTTP development.
    cookie-secure: ${MC_COOKIE_SECURE:true}
    attempts-per-hour: 20
  turnstile:
    # Cloudflare's bot check in front of sign-up, sign-in and the two endpoints that mail an
    # address the caller chose. Both keys blank switches it off, which is the local default:
    # a laptop is not on the widget's domain list, so a required challenge here would be a
    # form nobody could submit. Setting only one of the two fails the check at startup.
    site-key: ${MC_TURNSTILE_SITE_KEY:}
    secret-key: ${MC_TURNSTILE_SECRET_KEY:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    # The hostnames siteverify may report a challenge as having been solved on: the two
    # public domains, one of which the phone's webview also renders under (it has no
    # hostname of its own, so it borrows the production one).
    #
    # Deliberately not localhost. The site key is public and the widget's own domain list
    # allows localhost so that it can be developed against -- which means anybody can solve
    # a real challenge for this site on their own machine. Accepting the resulting token
    # here would make the whole check ornamental. Somebody who does want a real challenge
    # locally sets this to include it, knowingly.
    hostnames: ${MC_TURNSTILE_HOSTNAMES:rekordo.jannekeipert.de,rekordo-staging.jannekeipert.de}
    # Short on purpose: this call sits in front of every sign-in, so a slow Cloudflare has to
    # fail rather than hold the request open.
    timeout: PT5S
  mail:
    base-url: ${MC_MAIL_BASE_URL:http://mail-service.mailservice.svc.cluster.local:8080}
    # Blank disables sending: reset links are logged instead. That is the local default, so
    # nothing can mail a real person from a laptop by accident.
    api-key: ${MC_MAIL_API_KEY:}
    public-url: ${MC_PUBLIC_URL:http://localhost:5173}
  push:
    # Expo's push service. It fans out to APNs and FCM on our behalf, so nothing here ever
    # holds an Apple key -- EAS does, and the device's Expo token is what names it.
    endpoint: ${MC_PUSH_ENDPOINT:https://exp.host/--/api/v2/push/send}
    # Off by default, which is the local default for the same reason mail is: nothing should
    # be able to buzz a real phone from a laptop by accident.
    enabled: ${MC_PUSH_ENABLED:false}
  oauth:
    public-base-url: ${MC_PUBLIC_URL:http://localhost:5173}
    # Where the callback reopens the phone app. Matches the "scheme" in the mobile app.json;
    # the provider never sees this, only the https redirect URI built from public-base-url.
    # Deliberately still the old name during the rename: this value has to change in the
    # same breath as the shipped app's scheme, or a build that is listening for
    # musiccollector:// never learns its sign-in finished.
    mobile-redirect-uri: ${MC_MOBILE_REDIRECT_URI:musiccollector://auth/callback}
    # A provider appears on the sign-in screen only when its credentials are set, so an
    # unconfigured one is invisible rather than a button that fails.
    providers:
      google:
        display-name: Google
        client-id: ${MC_OAUTH_GOOGLE_CLIENT_ID:}
        client-secret: ${MC_OAUTH_GOOGLE_CLIENT_SECRET:}
        authorize-url: https://accounts.google.com/o/oauth2/v2/auth
        token-url: https://oauth2.googleapis.com/token
        user-info-url: https://openidconnect.googleapis.com/v1/userinfo
        scope: openid email profile
      apple:
        display-name: Apple
        client-id: ${MC_OAUTH_APPLE_CLIENT_ID:}
        # The contents of the .p8 key, not a static secret — Apple wants a signed JWT.
        client-secret: ${MC_OAUTH_APPLE_KEY:}
        team-id: ${MC_OAUTH_APPLE_TEAM_ID:}
        key-id: ${MC_OAUTH_APPLE_KEY_ID:}
        authorize-url: https://appleid.apple.com/auth/authorize
        token-url: https://appleid.apple.com/auth/token
        scope: openid email name
        # Apple rejects a name/e-mail scope request that does not ask for form_post, and
        # then answers by POSTing the callback instead of redirecting to it.
        response-mode: form_post
  storage:
    endpoint: ${MC_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MC_MINIO_ACCESS_KEY:musiccollector}
    secret-key: ${MC_MINIO_SECRET_KEY:musiccollector-secret}
    bucket: ${MC_MINIO_BUCKET:music-collector-photos}
    # The profile picture arrives at full resolution -- the client re-encodes it upright
    # but does not shrink it, because the server renders the 512px circle itself. 15 MB
    # leaves room for a large phone photo without letting the endpoint be free storage.
    max-upload-bytes: 15728640
    # A sleeve photo is scaled to 1600px by both clients before it is offered, which puts a
    # normal one around 300 kB. 5 MB is generous for that and still refuses an original
    # from an older app version early rather than after it has eaten a quarter of a quota.
    max-photo-bytes: 5242880
    # 20 MB per account: roughly sixty-five sleeve photos at the size the clients produce,
    # which is more than a real shelf ever has pictured, and a firm ceiling on what one
    # sign-up can cost.
    quota-bytes: 20971520
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    cover-art-base-url: https://coverartarchive.org
    # MusicBrainz requires a descriptive, contactable User-Agent and caps callers at 1 req/s.
    user-agent: ${MC_MUSICBRAINZ_USER_AGENT:Rekordo/0.1 (https://github.com/Janne6565/rekordo-backend)}
    requests-per-second: 1
    # Per-IP quota for the open metadata proxy.
    anonymous-requests-per-minute: 30

  discogs:
    base-url: https://api.discogs.com
    # Discogs rejects the default Java User-Agent outright.
    user-agent: ${MC_DISCOGS_USER_AGENT:Rekordo/0.1 +https://rekordo.jannekeipert.de}
    # Optional, and the app runs without it — but anonymous callers get 25 requests a
    # minute instead of 60, and every cover image comes back as an empty string.
    token: ${MC_DISCOGS_TOKEN:}
    requests-per-minute: ${MC_DISCOGS_REQUESTS_PER_MINUTE:25}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Where the app's own meters go. The tracing agent is a separate exporter with a separate
  # endpoint -- gRPC on 4317 for spans, this HTTP one on 4318 for metrics -- and the agent's
  # metric exporter is switched off in the Dockerfile so the two cannot both publish the JVM.
  #
  # Resource attributes are not set here: Micrometer's OtlpConfig reads OTEL_SERVICE_NAME and
  # OTEL_RESOURCE_ATTRIBUTES from the environment, which is the same pair the agent reads, so
  # one setting names this service for both signals and they cannot drift apart.
  otlp:
    metrics:
      export:
        # Off is the local default: a laptop should not write into the cluster's telemetry
        # store. The URL must be the OTLP-*HTTP* port with its scheme and path, since this
        # registry speaks HTTP/protobuf and not gRPC.
        enabled: ${MC_OTLP_METRICS_ENABLED:false}
        url: ${MC_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 30s
  metrics:
    distribution:
      # Without this a timer ships only count and sum, and every latency question can be
      # answered with a mean and nothing else -- which is exactly the statistic that hides
      # the slow tail everybody actually cares about.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      # No expected-value bounds here. These keys match by prefix, so a bound meant for the
      # http.server.requests timer also lands on http.server.requests.active -- a long task
      # timer whose own minimum is two minutes -- and Micrometer rejects the pair at the
      # first request with "maximumExpectedValue must be >= minimumExpectedValue". Every
      # request 500s while the app itself looks perfectly healthy. The defaults span a
      # millisecond to thirty seconds, which covers both a local call and a slow Discogs one.

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rekordo: DEBUG
